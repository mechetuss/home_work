# Portable desired environment, for Linux HPC and the student package.
# On servers with old Conda (such as 4.11), prefer: bash scripts/install_env.sh
# because a full conda env create may consume substantial RAM in dependency solving.
name: immune-mixcr
channels:
  - milaboratories
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - mixcr=4.7.0
  - pip:
      - numpy==1.26.4
      - pandas==2.2.3
      - scipy>=1.12,<1.16
      - matplotlib>=3.8,<3.11
      - seaborn>=0.13,<0.14
      - scikit-learn>=1.4,<2
      - statsmodels>=0.14,<0.15
      - networkx>=3,<4
      - biopython>=1.82,<2
      - logomaker>=0.8,<0.9
      - tqdm
      - pyyaml
      - plotly
      - ipykernel
      - jupyterlab
      - ipywidgets
      - repseq[clustering]==0.1.3
